# MakineAI Recipe - GameMaker Generic
# Generic recipe for GameMaker Studio games
# Works with data.win binary format

metadata:
  name: "GameMaker Generic"
  version: "1.0.0"
  author: "MakineAI Team"
  description: "Generic recipe for GameMaker Studio 1.x and 2.x games"
  engine: "gamemaker"
  engine_version: "GMS 1.4 - GMS 2.x"
  support_level: "silver"
  tested_games:
    - "Undertale"
    - "Deltarune"
    - "Hotline Miami"
  created: "2026-01-24"
  updated: "2026-01-24"

files:
  - path: "data.win"
    encoding: "binary"
    format: "binary"
    translatable: true

  - path: "*.exe"
    encoding: "binary"
    format: "binary"
    translatable: false
    # Executable, do not modify

  - path: "*.ogg"
    encoding: "binary"
    format: "audio"
    translatable: false

  - path: "*.wav"
    encoding: "binary"
    format: "audio"
    translatable: false

extraction:
  method: "binary_offset"
  patterns:
    - "STRG"                         # String table chunk
    - "TXTR"                         # Texture (for reference)
    - "SCPT"                         # Scripts (for reference)
  min_length: 2
  max_length: 10000

validation:
  max_line_length: 1000
  preserve_patterns:
    - "\\\\n"                        # Newline escape
    - "\\\\r"                        # Carriage return
    - "#[0-9a-fA-F]{6,8}"           # Color codes
    - "\\^[0-9]"                    # Special formatting
  forbidden_chars:
    - "\x00"                         # Null bytes (handled separately)
  allow_empty: false

application:
  method: "binary_patch"
  preserve_formatting: true
  backup_original: true
  backup_suffix: ".makineai.bak"

variables:
  string_chunk: "STRG"
  form_chunk: "FORM"
  max_string_expansion: 1.5         # Turkish can be 1.5x longer than English
