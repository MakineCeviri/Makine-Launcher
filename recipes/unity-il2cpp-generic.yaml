# MakineAI Recipe - Unity IL2CPP Generic
# For Unity games using IL2CPP backend
# Extracts strings from IL2CPP metadata and GameAssembly.dll

metadata:
  name: "Unity IL2CPP Generic"
  version: "1.0.0"
  author: "MakineAI Team"
  description: "Generic extraction for Unity IL2CPP games. Best used with BepInEx/XUnity runtime translation."
  engine: "unity"
  engine_version: "2019+"
  support_level: "silver"
  created: "2026-01-23"
  updated: "2026-01-23"
  tested_games:
    - "Afterparty"
    - "Storyteller"
    - "The Red Lantern"
    - "Disco Elysium"

files:
  - path: "**/global-metadata.dat"
    encoding: "binary"
    format: "binary"
    translatable: true
  - path: "**/GameAssembly.dll"
    encoding: "binary"
    format: "binary"
    translatable: true
  - path: "**/*.assets"
    encoding: "binary"
    format: "binary"
    translatable: true
  - path: "**/StreamingAssets/**/*.json"
    encoding: "utf-8"
    format: "json"
    translatable: true

extraction:
  method: "binary_offset"
  min_length: 3
  max_length: 5000
  patterns:
    - "il2cpp_metadata"
    - "unity_assets"

validation:
  max_line_length: 1000
  allow_empty: false
  preserve_patterns:
    - "{\\w+}"       # Format placeholders
    - "\\[\\w+\\]"   # Tag markers
    - "<[^>]+>"      # Rich text tags
    - "\\n"          # Newlines
    - "%[sd]"        # Printf format

application:
  method: "runtime_hook"
  preserve_formatting: true
  backup_original: true
  backup_suffix: ".makineai.bak"

variables:
  use_classifier: "true"
  classifier_confidence: "0.5"
  prefer_runtime: "true"
