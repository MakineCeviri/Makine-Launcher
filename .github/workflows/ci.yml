# MakineAI CI Pipeline
# Comprehensive build, test, and quality checks

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  # =============================================================================
  # CODE QUALITY CHECKS (Fast, runs first)
  # =============================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting (clang-format)
        uses: jidicula/clang-format-action@v4.13.0
        continue-on-error: true
        with:
          clang-format-version: '17'
          check-path: 'core'
          fallback-style: 'file'


  # =============================================================================
  # BUILD CORE + TESTS
  # =============================================================================
  build:
    name: Build & Test
    runs-on: windows-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v5
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
          key: vcpkg-win-${{ hashFiles('vcpkg.json') }}-v4
          restore-keys: |
            vcpkg-win-

      - name: Install vcpkg dependencies
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          cd C:\vcpkg
          git pull
          .\bootstrap-vcpkg.bat
          vcpkg integrate install
          cd $env:GITHUB_WORKSPACE
          vcpkg install --triplet x64-windows

      - name: Configure Core
        run: |
          cmake -B build/core -S core `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_TESTING=ON

      - name: Build Core
        run: cmake --build build/core --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run Unit Tests
        run: |
          cd build/core
          ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --timeout 120
        continue-on-error: true

      - name: Upload Core Library
        uses: actions/upload-artifact@v4
        with:
          name: core-lib
          path: build/core/${{ env.BUILD_TYPE }}/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/core/Testing/
          if-no-files-found: ignore
          retention-days: 7

  # =============================================================================
  # BUILD QML APP
  # =============================================================================
  build-qml:
    name: Build QML App
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtquick3d qtshadertools'
          cache: true

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
          key: vcpkg-win-${{ hashFiles('vcpkg.json') }}-v4
          restore-keys: |
            vcpkg-win-

      - name: Download Core Library
        uses: actions/download-artifact@v4
        with:
          name: core-lib
          path: build/core/${{ env.BUILD_TYPE }}/

      - name: Configure QML App
        run: |
          cmake -B build/qml -S qml `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build QML App
        run: cmake --build build/qml --config ${{ env.BUILD_TYPE }} --parallel

      - name: Smoke Test
        run: |
          $exe = "build/qml/${{ env.BUILD_TYPE }}/MakineAI.exe"
          if (Test-Path $exe) {
            Write-Host "✅ Executable built successfully"
            $size = (Get-Item $exe).Length / 1MB
            Write-Host "📦 Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "❌ Executable not found"
            exit 1
          }

      - name: Upload QML App
        uses: actions/upload-artifact@v4
        with:
          name: makineai-${{ github.sha }}
          path: build/qml/${{ env.BUILD_TYPE }}/
          retention-days: 7

  # =============================================================================
  # STATIC ANALYSIS (Parallel with build)
  # =============================================================================
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        continue-on-error: true
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            --xml --xml-version=2 \
            core/src core/include 2> cppcheck-report.xml

      - name: Upload Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis
          path: cppcheck-report.xml
          retention-days: 7

  # =============================================================================
  # STATUS CHECK
  # =============================================================================
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [quality, build, build-qml, static-analysis]
    if: always()

    steps:
      - name: Check Status
        run: |
          echo "Quality: ${{ needs.quality.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "QML: ${{ needs.build-qml.result }}"
          echo "Analysis: ${{ needs.static-analysis.result }}"

          if [ "${{ needs.quality.result }}" == "failure" ]; then
            echo "::error::Code quality checks failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "::error::Core build failed"
            exit 1
          fi
          if [ "${{ needs.build-qml.result }}" == "failure" ]; then
            echo "::error::QML build failed"
            exit 1
          fi
          echo "✅ All checks passed!"
