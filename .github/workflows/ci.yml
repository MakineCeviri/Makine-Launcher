name: Build & test

# The dev preset, unchanged, on a clean Windows machine: MinGW 13.1 + Qt 6.11.1
# from the Qt mirrors, vcpkg packages (cached) and a throwaway package key.
# Crash reporting is left out — it needs the Sentry DSN, which CI does not hold.

on:
  push:
    branches: [dev, ci/**]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows MinGW
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
      VCPKG_PACKAGES: openssl nlohmann-json zstd spdlog gtest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.11.1 + MinGW 13.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: windows
          target: desktop
          arch: win64_mingw
          dir: 'C:\'
          tools: 'tools_mingw1310 tools_ninja'
          # aqtinstall 3.3.0 cannot read the Qt 6.11 repository layout
          # ("Failed to locate XML data"); this commit can.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          cache: true

      - name: Put MinGW and Qt on PATH
        run: |
          echo 'C:\Qt\Tools\mingw1310_64\bin' >> "$GITHUB_PATH"
          echo 'C:\Qt\Tools\Ninja' >> "$GITHUB_PATH"
          echo 'C:\Qt\6.11.1\mingw_64\bin' >> "$GITHUB_PATH"

      # Keyed on the runner's vcpkg commit: when the image updates vcpkg the
      # old binaries are restored, the changed ones rebuilt (openssl alone
      # takes ~25 min with MinGW) and saved under the new key.
      - name: Read vcpkg version
        id: vcpkg
        run: echo "commit=$(git -C "$VCPKG_ROOT" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-cache
          key: vcpkg-mingw-${{ steps.vcpkg.outputs.commit }}-${{ env.VCPKG_PACKAGES }}
          restore-keys: vcpkg-mingw-

      - name: Install vcpkg packages
        # Run outside the checkout: the repo's vcpkg.json would switch vcpkg
        # to manifest mode, and the presets use classic mode.
        working-directory: C:\vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ./vcpkg install $VCPKG_PACKAGES --triplet x64-mingw-dynamic

      # Right after the install, not at the end of the job: the post-job save
      # of actions/cache is skipped when a later step fails or the job times
      # out, and from 0.1.6 on every run rebuilt openssl for 30 minutes.
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-cache
          key: vcpkg-mingw-${{ steps.vcpkg.outputs.commit }}-${{ env.VCPKG_PACKAGES }}

      - name: Generate a throwaway package key
        run: |
          python -c "import pathlib, secrets; pathlib.Path('scripts/.encryption_key').write_text(secrets.token_hex(32))"
          python scripts/generate_key_header.py

      - name: Configure
        run: >
          cmake --preset dev
          -DMAKINE_CRASH_REPORTING=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=
          -DCMAKE_CXX_COMPILER_LAUNCHER=

      - name: Build
        run: cmake --build --preset dev

      # From 0.1.6 on makine_tests printed nothing and the job ran into its
      # 90-minute limit: a binary that cannot load (a DLL or an entry point
      # missing) waits on a loader dialog no one can see. Say which DLLs it
      # would take, and give a hang two minutes rather than the whole job.
      - name: Check the test binaries load
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_ROOT\installed\x64-mingw-dynamic\bin;$env:PATH"
          foreach ($dll in 'libstdc++-6.dll', 'libgcc_s_seh-1.dll', 'libwinpthread-1.dll', 'libgtest.dll', 'libfmt.dll', 'libspdlog.dll', 'libcrypto-3-x64.dll') {
            $hits = $env:PATH -split ';' | Where-Object { $_ -and (Test-Path (Join-Path $_ $dll)) }
            "${dll}: " + ($hits -join ' | ')
          }
          $p = Start-Process build\dev\makine_tests.exe -ArgumentList '--gtest_list_tests' -NoNewWindow -PassThru -RedirectStandardOutput list.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'makine_tests did not start within 2 minutes (loader dialog?)' }
          "makine_tests --gtest_list_tests: exit $($p.ExitCode), $((Get-Content list.txt).Count) lines"

      - name: Test
        run: ctest --preset dev-tests --output-on-failure --timeout 600
