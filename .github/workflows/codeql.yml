name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Her Pazartesi 06:00

permissions:
  security-events: write
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C++
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: +security-and-quality

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v5
        with:
          path: C:/vcpkg/installed
          key: vcpkg-classic-${{ hashFiles('vcpkg.json') }}-v6
          restore-keys: vcpkg-classic-

      - name: Install vcpkg dependencies
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $deps = (Get-Content vcpkg.json | ConvertFrom-Json).dependencies
          $triplet = "x64-windows"
          foreach ($dep in $deps) {
            Write-Host "Installing ${dep}:${triplet}..."
            C:/vcpkg/vcpkg install "${dep}:${triplet}" --classic --recurse
          }

      - name: Build for Analysis
        run: |
          cmake -B build/core -S core `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DBUILD_TESTING=OFF
          cmake --build build/core --config Release --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
