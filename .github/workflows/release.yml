name: Release

on:
  push:
    tags:
      - 'v*'

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build-release:
    name: Build Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtquick3d qtshadertools'
          cache: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '2024.01.12'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Install dependencies
        run: |
          cd ${{ github.workspace }}
          vcpkg install --triplet x64-windows

      - name: Build Core
        run: |
          cmake -B build/core -S core `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          cmake --build build/core --config ${{ env.BUILD_TYPE }}

      - name: Build QML App
        run: |
          cmake -B build/qml -S qml `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          cmake --build build/qml --config ${{ env.BUILD_TYPE }}

      - name: Deploy Qt
        run: |
          mkdir dist
          Copy-Item build/qml/${{ env.BUILD_TYPE }}/*.exe dist/
          Copy-Item build/qml/${{ env.BUILD_TYPE }}/*.dll dist/ -ErrorAction SilentlyContinue
          Set-Location dist
          windeployqt --qmldir ../qml/qml --release MakineAI.exe

      - name: Create Archive
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path dist/* -DestinationPath "MakineAI-$version-win64.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: MakineAI-*.zip
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
