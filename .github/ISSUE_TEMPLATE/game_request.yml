name: Game Support Request
description: Yeni bir oyun için çeviri desteği isteyin
title: "[Game]: "
labels: ["game-request", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Yeni oyun desteği isteği için teşekkürler!

  - type: input
    id: game_name
    attributes:
      label: Oyun Adı
      placeholder: "Örn: Elden Ring"
    validations:
      required: true

  - type: input
    id: steam_id
    attributes:
      label: Steam App ID
      description: Steam mağaza linkinden bulabilirsiniz
      placeholder: "Örn: 1245620"

  - type: dropdown
    id: engine
    attributes:
      label: Oyun Motoru
      description: Biliyorsanız seçin
      options:
        - Unity
        - Unreal Engine
        - RPG Maker
        - Ren'Py
        - GameMaker
        - Godot
        - Bilmiyorum
        - Diğer
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Steam
        - Epic Games
        - GOG
        - Xbox Game Pass
        - Diğer
    validations:
      required: true

  - type: textarea
    id: existing
    attributes:
      label: Mevcut Çeviri Durumu
      description: Bu oyun için başka Türkçe çeviri var mı?
      placeholder: |
        - Resmi Türkçe desteği: Yok
        - Fan çevirisi: Var (link: ...)

  - type: checkboxes
    id: verification
    attributes:
      label: Doğrulama
      options:
        - label: Bu oyunu satın aldım
          required: true
        - label: Oyunun çeviri ihtiyacı olduğunu doğruladım
          required: true
