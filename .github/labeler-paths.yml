# Auto-label PRs based on changed files
# Used by actions/labeler in labels.yml workflow

"scope: core":
  - changed-files:
      - any-glob-to-any-file: 'core/**/*'

"scope: ui":
  - changed-files:
      - any-glob-to-any-file:
          - 'qml/**/*'

"scope: build":
  - changed-files:
      - any-glob-to-any-file:
          - 'CMakeLists.txt'
          - '**/CMakeLists.txt'
          - 'CMakePresets.json'
          - 'vcpkg.json'
          - 'vcpkg-configuration.json'
          - 'justfile'

"scope: ci":
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**/*'
          - '.github/labeler-paths.yml'
          - '.github/labels.yml'
          - '.github/dependabot.yml'

"type: docs":
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - '**/*.md'
          - 'README*'
          - 'CHANGELOG*'
          - 'CONTRIBUTING*'

"type: testing":
  - changed-files:
      - any-glob-to-any-file:
          - 'core/tests/**/*'
          - '**/*test*'
          - '**/*_test.cpp'
          - '**/test_*.cpp'

"scope: security":
  - changed-files:
      - any-glob-to-any-file:
          - '**/security*'
          - '**/Security*'
          - '.github/SECURITY.md'

"scope: translation":
  - changed-files:
      - any-glob-to-any-file:
          - '**/translation*'
          - '**/glossary*'
          - '**/qa_service*'
          - 'recipes/**/*'

"engine: unity":
  - changed-files:
      - any-glob-to-any-file:
          - '**/unity*'
          - '**/Unity*'

"engine: unreal":
  - changed-files:
      - any-glob-to-any-file:
          - '**/unreal*'
          - '**/Unreal*'

"engine: rpgmaker":
  - changed-files:
      - any-glob-to-any-file:
          - '**/rpgmaker*'
          - '**/RPGMaker*'

"engine: renpy":
  - changed-files:
      - any-glob-to-any-file:
          - '**/renpy*'
          - '**/RenPy*'

"engine: gamemaker":
  - changed-files:
      - any-glob-to-any-file:
          - '**/gamemaker*'
          - '**/GameMaker*'

"engine: bethesda":
  - changed-files:
      - any-glob-to-any-file:
          - '**/bethesda*'
          - '**/Bethesda*'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'vcpkg.json'
          - 'vcpkg-configuration.json'
