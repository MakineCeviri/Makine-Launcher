# MakineAI CI/CD Infrastructure — Portainer Stack
#
# Portainer'dan deploy:
#   Stacks > Add stack > Upload docker-compose.yml
#   Environment variables'a GITHUB_PAT ekle
#
# Veya CLI'dan:
#   cd /opt/makineai && docker compose -p makineai up -d
#
# Environment variables (Portainer stack config veya .env dosyasi):
#   GITHUB_PAT — GitHub PAT (repo scope) — runner auto-registration icin

services:
  # ── GitHub Actions Self-Hosted Runner ─────────────────────────────────
  # Deploy job'larini calistirir (GitHub Release olusturma, dosya kopyalama)
  # Build job'lari GitHub-hosted Windows runner'da calisir
  runner:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    environment:
      RUNNER_NAME: makineai-server
      RUNNER_WORKDIR: /home/runner/_work
      LABELS: deploy,linux,self-hosted
      RUNNER_SCOPE: repo
      REPO_URL: https://github.com/MakineCeviri/MakineAI-Launcher
      ACCESS_TOKEN: ${GITHUB_PAT}
      DISABLE_AUTO_UPDATE: "true"
      REPLACE_EXISTING_RUNNER: "true"
    volumes:
      - runner-work:/home/runner/_work
      - runner-data:/home/runner
    labels:
      - "com.makineai.service=ci-runner"
      - "com.makineai.description=GitHub Actions self-hosted runner for deployments"

  # ── Release File Server ───────────────────────────────────────────────
  # Release artifact'lerini sunar (GitHub Releases yedegi)
  # Erisim: http://sunucu:8880/
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8880:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - releases:/srv/releases
      - caddy-data:/data
      - caddy-config:/config
    labels:
      - "com.makineai.service=release-server"
      - "com.makineai.description=Release artifact file server"

volumes:
  runner-work:
  runner-data:
  releases:
  caddy-data:
  caddy-config:
